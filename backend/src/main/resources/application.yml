server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: meramahan
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

# MeraMahan Application Settings
app:
  name: MeraMahan
  tagline: "Your Voice. Your Community. Your India."
  support-email: ${APP_SUPPORT_EMAIL:help@meramahan.in}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  otp:
    expiration-minutes: 5
    resend-cooldown-seconds: 60
    max-attempts: 5
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload:
    local-dir: ${UPLOAD_DIR:uploads}
